version: "3"

tasks:
  setup:
    desc: Install dependencies and git hooks
    cmds:
      - uv sync
      - uv run pre-commit install
  up:
    desc: Start postgres and metabase (app is added in milestone 4)
    cmds:
      - docker compose up -d --wait
  db:
    desc: Start only postgres (enough for data, tests and report)
    cmds:
      - docker compose up -d --wait postgres
  down:
    cmds:
      - docker compose down
  data:
    desc: Create schema and seed synthetic data (deterministic, prints a content hash)
    cmds:
      - uv run python -m lagerlotse.data.seed
  test:
    desc: Run tests (needs postgres, see `task db`)
    cmds:
      - uv run pytest
  lint:
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy
  ask:
    desc: 'Ask the agent one question, e.g. task ask -- "Welche Kunden ...?" (needs ANTHROPIC_API_KEY)'
    cmds:
      - uv run python -m lagerlotse.agent.cli {{.CLI_ARGS}}
  eval:
    desc: Run the agent evaluation set (needs ANTHROPIC_API_KEY)
    cmds:
      - uv run python -m lagerlotse.agent.eval
  report:
    desc: Generate weekly report and README tables from results/
    cmds:
      - uv run python -m lagerlotse.report
