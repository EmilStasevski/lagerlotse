# Local: `task up`. On a server, set POSTGRES_PASSWORD, LAGERLOTSE_READER_PASSWORD and
# LAGERLOTSE_APP_KEY in .env (see docs/DEPLOY.md). Ports bind to localhost only.
x-db-urls: &db-urls
  LAGERLOTSE_DATABASE_URL: postgresql+psycopg://lagerlotse:${POSTGRES_PASSWORD:-lagerlotse}@postgres:5432/lagerlotse
  LAGERLOTSE_READER_DATABASE_URL: postgresql+psycopg://lagerlotse_reader:${LAGERLOTSE_READER_PASSWORD:-lagerlotse_reader}@postgres:5432/lagerlotse

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lagerlotse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lagerlotse}
      POSTGRES_DB: lagerlotse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagerlotse"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *db-urls
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 6

  metabase:
    image: metabase/metabase:v0.65.7.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      # Fixed heap so the stack fits a 4 GB machine (docs/DEPLOY.md); enough for this dashboard.
      JAVA_OPTS: ${MB_JAVA_OPTS:--Xmx1g}

volumes:
  pgdata:
  metabase-data:
