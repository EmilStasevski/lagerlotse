services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lagerlotse
      POSTGRES_PASSWORD: lagerlotse
      POSTGRES_DB: lagerlotse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagerlotse"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  pgdata:
  metabase-data:
