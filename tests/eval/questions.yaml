# Evaluation set for the agent. Run with `task eval`; results go to results/eval.json.
#
# Reference date of the dataset: 2026-11-20 (Friday), seed 42.
# "letztes Quartal" = Q3 2026, "letzter Monat" = October 2026, "dieses Jahr" = 2026 up to 20.11.
#
# Expected figures are computed by the SQL below, independently of the tool code. Every SQL is a
# SELECT returning one number; the runner prepends this CTE so queries stay short:
#   sales(order_id, order_date, customer_id, product_id, quantity, revenue, cost, margin)
#   = order lines of all orders that are not cancelled.
#
# A query may start with its own WITH clause; `sales` is then added as the first CTE.
#
# A question passes when: the expected tools were called (none for out_of_scope), every expected
# figure and text appears in the answer (figures may be rounded to the precision shown), the
# number check did not flag the answer, and the agent finished (no error, no round limit).

- id: a01
  category: answerable
  question: Welche fünf Kunden hatten im letzten Quartal den höchsten Umsatz?
  expected_tools: [top_customers]
  expected_text: [Wendrich Schaltschrankbau AG]
  expected_figures:
    - label: Umsatz Platz 1
      sql: >-
        SELECT max(r) FROM (SELECT sum(revenue) r FROM sales
        WHERE order_date BETWEEN '2026-07-01' AND '2026-09-30' GROUP BY customer_id) x

