- id: a16
  category: answerable
  question: Was sollten wir diese Woche nachbestellen?
  expected_tools: [reorder_suggestions]
  expected_text: [KS-10021]
  expected_figures:
    - label: Anzahl Vorschläge
      sql: >-
        WITH d AS (SELECT product_id, sum(quantity) / 90.0 AS daily FROM sales
        WHERE order_date BETWEEN '2026-08-23' AND '2026-11-20' GROUP BY 1),
        o AS (SELECT pl.product_id, sum(pl.quantity) AS units FROM purchase_orders po
        JOIN purchase_order_lines pl ON pl.po_id = po.id WHERE po.status = 'open' GROUP BY 1),
        x AS (SELECT p.purchase_price, p.min_order_qty, s.lead_time_days AS lt, d.daily,
        st.on_hand - st.reserved + coalesce(o.units, 0) AS position FROM products p
        JOIN suppliers s ON s.id = p.supplier_id JOIN stock st ON st.product_id = p.id
        JOIN d ON d.product_id = p.id LEFT JOIN o ON o.product_id = p.id WHERE p.active)
        SELECT count(*) FROM x WHERE position < ceil(daily * (lt + 14))
    - label: Kosten aller Vorschläge
      sql: >-
        WITH d AS (SELECT product_id, sum(quantity) / 90.0 AS daily FROM sales
        WHERE order_date BETWEEN '2026-08-23' AND '2026-11-20' GROUP BY 1),
        o AS (SELECT pl.product_id, sum(pl.quantity) AS units FROM purchase_orders po
        JOIN purchase_order_lines pl ON pl.po_id = po.id WHERE po.status = 'open' GROUP BY 1),
        x AS (SELECT p.purchase_price, p.min_order_qty, s.lead_time_days AS lt, d.daily,
        st.on_hand - st.reserved + coalesce(o.units, 0) AS position FROM products p
        JOIN suppliers s ON s.id = p.supplier_id JOIN stock st ON st.product_id = p.id
        JOIN d ON d.product_id = p.id LEFT JOIN o ON o.product_id = p.id WHERE p.active)
        SELECT sum(ceil((ceil(daily * (lt + 44)) - position) / min_order_qty) * min_order_qty
        * purchase_price) FROM x WHERE position < ceil(daily * (lt + 14))

