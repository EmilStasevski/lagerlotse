<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Lagerlotse{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1f2933; --muted: #66707a; --line: #e3e5e8;
    --accent: #1d5fa8; --ok-bg: #e6f4ea; --ok: #1e6b34; --warn-bg: #fdecea; --warn: #a32014;
    --info-bg: #eef1f5; --mark: #ffd8d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c; --panel: #1e2227; --text: #e4e7eb; --muted: #9aa3ad; --line: #333a42;
      --accent: #7fb0ea; --ok-bg: #173523; --ok: #8fd6a4; --warn-bg: #43201c; --warn: #f3a59a;
      --info-bg: #262b31; --mark: #6b2a22;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { border-bottom: 1px solid var(--line); background: var(--panel); }
  .wrap { max-width: 56rem; margin: 0 auto; padding: 0 1rem; }
  header .wrap { display: flex; align-items: center; gap: 1rem; min-height: 3.5rem; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header nav { margin-left: auto; display: flex; gap: 1rem; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
  button, input[type=text], input[type=password] {
    font: inherit; padding: .6rem .8rem; border-radius: .5rem; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { button.primary { color: #10151a; } }
  table { border-collapse: collapse; font-size: .92rem; }
  th, td { border-bottom: 1px solid var(--line); padding: .3rem .5rem; text-align: left; }
  .table-scroll { overflow-x: auto; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Lagerlotse</h1>
  <span class="muted">Assistent für Vertrieb, Einkauf und Lager</span>
  <nav><a href="/">Assistent</a><a href="/bericht">Wochenbericht</a></nav>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
